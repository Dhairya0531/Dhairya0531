<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3">
        <animate attributeName="stop-color" values="#818cf8;#34d399;#38bdf8;#818cf8" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#080c10" />
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.25); }
    }
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
    }
    .cursor {
      animation: blinkCursor 1s infinite steps(2, start);
    }
    .pulse-dot {
      animation: statusPulse 2.2s infinite ease-in-out;
      transform-origin: center;
    }
  </style>

  <!-- Outer Ambient Glow Border -->
  <rect x="2" y="2" width="846" height="346" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" opacity="0.6" filter="url(#softGlow)" />

  <!-- Terminal Window -->
  <rect x="2" y="2" width="846" height="346" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1" />

  <!-- Window Header Bar -->
  <path d="M 2,14 A 12,12 0 0 1 14,2 L 836,2 A 12,12 0 0 1 848,14 L 848,36 L 2,36 Z" fill="#161b22" />
  <line x1="2" y1="36" x2="848" y2="36" stroke="#21262d" stroke-width="1" />

  <!-- macOS Control Buttons -->
  <circle cx="22" cy="19" r="5" fill="#ff5f56" />
  <circle cx="38" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="19" r="5" fill="#27c93f" />

  <!-- Title Center -->
  <text x="425" y="23" fill="#8b949e" font-size="11.5" class="mono" font-weight="500" text-anchor="middle">dhairya@distributed-systems:~ (zsh)</text>

  <!-- Live Status Right -->
  <circle class="pulse-dot" cx="808" cy="19" r="4" fill="#22c55e" />
  <text x="774" y="23" fill="#22c55e" font-size="10.5" class="mono" font-weight="600" text-anchor="end">SYS: READY</text>

  <!-- Terminal Content Area -->
  <g transform="translate(32, 64)">

    <!-- Command 1: whoami -->
    <text x="0" y="0" fill="#38bdf8" font-size="13" class="mono" font-weight="700">dhairya@distributed-systems</text>
    <text x="216" y="0" fill="#8b949e" font-size="13" class="mono">:</text>
    <text x="226" y="0" fill="#34d399" font-size="13" class="mono" font-weight="600">~</text>
    <text x="236" y="0" fill="#8b949e" font-size="13" class="mono">$</text>
    <text x="252" y="0" fill="#f0f6fc" font-size="13" class="mono" font-weight="600">whoami</text>

    <!-- Output 1 -->
    <text x="0" y="24" fill="#58a6ff" font-size="15" class="mono" font-weight="700">Dhairya Rupani</text>
    <text x="0" y="44" fill="#e6edf3" font-size="12.5" class="mono" font-weight="500">Backend &amp; Distributed Systems Engineer</text>
    <text x="0" y="64" fill="#8b949e" font-size="12" class="mono">Building reliable systems, low-latency APIs, and algorithmic models.</text>

    <!-- Command 2: cat core_stack.txt -->
    <g transform="translate(0, 96)">
      <text x="0" y="0" fill="#38bdf8" font-size="13" class="mono" font-weight="700">dhairya@distributed-systems</text>
      <text x="216" y="0" fill="#8b949e" font-size="13" class="mono">:</text>
      <text x="226" y="0" fill="#34d399" font-size="13" class="mono" font-weight="600">~</text>
      <text x="236" y="0" fill="#8b949e" font-size="13" class="mono">$</text>
      <text x="252" y="0" fill="#f0f6fc" font-size="13" class="mono" font-weight="600">cat core_stack.txt</text>

      <!-- Clean CLI Stack Box -->
      <rect x="0" y="14" width="600" height="34" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="18" y="36" fill="#7ee787" font-size="12" class="mono" font-weight="600">Go</text>
      <text x="44" y="36" fill="#484f58" font-size="12" class="mono">·</text>
      <text x="58" y="36" fill="#7ee787" font-size="12" class="mono" font-weight="600">Java</text>
      <text x="98" y="36" fill="#484f58" font-size="12" class="mono">·</text>
      <text x="112" y="36" fill="#7ee787" font-size="12" class="mono" font-weight="600">PostgreSQL</text>
      <text x="198" y="36" fill="#484f58" font-size="12" class="mono">·</text>
      <text x="212" y="36" fill="#7ee787" font-size="12" class="mono" font-weight="600">Redis</text>
      <text x="256" y="36" fill="#484f58" font-size="12" class="mono">·</text>
      <text x="270" y="36" fill="#7ee787" font-size="12" class="mono" font-weight="600">Docker</text>
      <text x="324" y="36" fill="#484f58" font-size="12" class="mono">·</text>
      <text x="338" y="36" fill="#7ee787" font-size="12" class="mono" font-weight="600">Kubernetes</text>
      <text x="424" y="36" fill="#484f58" font-size="12" class="mono">·</text>
      <text x="438" y="36" fill="#7ee787" font-size="12" class="mono" font-weight="600">AWS</text>
    </g>

    <!-- Command 3: sysctl -n hw.verified_benchmarks -->
    <g transform="translate(0, 172)">
      <text x="0" y="0" fill="#38bdf8" font-size="13" class="mono" font-weight="700">dhairya@distributed-systems</text>
      <text x="216" y="0" fill="#8b949e" font-size="13" class="mono">:</text>
      <text x="226" y="0" fill="#34d399" font-size="13" class="mono" font-weight="600">~</text>
      <text x="236" y="0" fill="#8b949e" font-size="13" class="mono">$</text>
      <text x="252" y="0" fill="#f0f6fc" font-size="13" class="mono" font-weight="600">sysctl -n hw.verified_benchmarks</text>

      <text x="0" y="22" fill="#7ee787" font-size="11.5" class="mono">[OK]</text>
      <text x="42" y="22" fill="#8b949e" font-size="11.5" class="mono">API Gateway Throughput :</text>
      <text x="230" y="22" fill="#e6edf3" font-size="11.5" class="mono" font-weight="600">10,000+ req/min @ p95 &lt; 2ms (k6 validated)</text>

      <text x="0" y="40" fill="#7ee787" font-size="11.5" class="mono">[OK]</text>
      <text x="42" y="40" fill="#8b949e" font-size="11.5" class="mono">Complex Network Scale  :</text>
      <text x="230" y="40" fill="#e6edf3" font-size="11.5" class="mono" font-weight="600">12,846 nodes &amp; 28,412 edges (+198% throughput)</text>

      <text x="0" y="58" fill="#7ee787" font-size="11.5" class="mono">[OK]</text>
      <text x="42" y="58" fill="#8b949e" font-size="11.5" class="mono">Algorithmic Problem-Solving :</text>
      <text x="230" y="58" fill="#e6edf3" font-size="11.5" class="mono" font-weight="600">LeetCode Knight (1869) · 1,300+ Solved</text>
    </g>

    <!-- Active Prompt with cursor -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#38bdf8" font-size="13" class="mono" font-weight="700">dhairya@distributed-systems</text>
      <text x="216" y="0" fill="#8b949e" font-size="13" class="mono">:</text>
      <text x="226" y="0" fill="#34d399" font-size="13" class="mono" font-weight="600">~</text>
      <text x="236" y="0" fill="#8b949e" font-size="13" class="mono">$</text>
      <text x="252" y="0" fill="#38bdf8" font-size="13" class="mono" font-weight="600">./explore --projects</text>
      <rect class="cursor" x="424" y="-11" width="8" height="15" fill="#58a6ff" />
    </g>

  </g>
</svg>
