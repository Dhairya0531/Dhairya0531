<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="850" height="280" fill="none">
  <defs>
    <linearGradient id="netBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>

    <filter id="hubGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes carFlow1 {
      0% { cx: 80; cy: 80; opacity: 0; }
      15% { opacity: 1; }
      45% { cx: 280; cy: 150; }
      75% { cx: 500; cy: 110; }
      100% { cx: 740; cy: 80; opacity: 0; }
    }
    @keyframes carFlow2 {
      0% { cx: 120; cy: 220; opacity: 0; }
      15% { opacity: 1; }
      50% { cx: 280; cy: 150; }
      80% { cx: 480; cy: 210; }
      100% { cx: 710; cy: 220; opacity: 0; }
    }
    @keyframes carFlow3 {
      0% { cx: 280; cy: 30; opacity: 0; }
      20% { opacity: 1; }
      55% { cx: 280; cy: 150; }
      85% { cx: 500; cy: 110; }
      100% { cx: 500; cy: 260; opacity: 0; }
    }
    @keyframes pulseHub {
      0%, 100% { r: 11; opacity: 0.9; }
      50% { r: 16; opacity: 0.4; }
    }
    .net-font {
      font-family: 'JetBrains Mono', monospace;
    }
    .road-edge {
      stroke: #1e293b;
      stroke-width: 2.5;
    }
    .active-edge {
      stroke: #38bdf8;
      stroke-width: 2;
      stroke-dasharray: 6, 6;
      animation: carFlowDash 2s linear infinite;
    }
    @keyframes carFlowDash {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }
    .traffic-pulse-1 {
      animation: carFlow1 3s ease-in-out infinite;
    }
    .traffic-pulse-2 {
      animation: carFlow2 3.5s ease-in-out infinite 0.7s;
    }
    .traffic-pulse-3 {
      animation: carFlow3 4s ease-in-out infinite 1.4s;
    }
    .hub-beacon {
      animation: pulseHub 2s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Frame Background -->
  <rect x="5" y="5" width="840" height="270" rx="14" fill="url(#netBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Sub-header Bar -->
  <rect x="5" y="5" width="840" height="36" rx="14" fill="#0f172a" />
  <line x1="5" y1="41" x2="845" y2="41" stroke="#1e293b" stroke-width="1" />
  <text x="24" y="26" fill="#f59e0b" font-size="11.5" class="net-font" font-weight="700">COMPLEX NETWORK SIMULATION</text>
  <text x="235" y="26" fill="#64748b" font-size="10.5" class="net-font">| OpenStreetMap Directed Graph Topology</text>
  <rect x="680" y="11" width="145" height="20" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
  <text x="688" y="25" fill="#a5b4fc" font-size="10" class="net-font" font-weight="600">+198% THROUGHPUT</text>

  <!-- Graph Road Edges (Background Grid) -->
  <line x1="80" y1="80" x2="280" y2="150" class="active-edge" />
  <line x1="120" y1="220" x2="280" y2="150" class="active-edge" />
  <line x1="280" y1="30" x2="280" y2="150" class="active-edge" />
  <line x1="280" y1="150" x2="500" y2="110" class="active-edge" />
  <line x1="280" y1="150" x2="480" y2="210" class="active-edge" />
  <line x1="500" y1="110" x2="740" y2="80" class="active-edge" />
  <line x1="480" y1="210" x2="710" y2="220" class="active-edge" />
  <line x1="500" y1="110" x2="480" y2="210" class="road-edge" />
  <line x1="500" y1="110" x2="500" y2="260" class="road-edge" />
  <line x1="740" y1="80" x2="710" y2="220" class="road-edge" />

  <!-- Animated Moving Vehicles -->
  <circle class="traffic-pulse-1" r="5.5" fill="#38bdf8" filter="url(#hubGlow)" />
  <circle class="traffic-pulse-2" r="5" fill="#34d399" filter="url(#hubGlow)" />
  <circle class="traffic-pulse-3" r="5" fill="#fbbf24" filter="url(#hubGlow)" />

  <!-- Standard Graph Nodes -->
  <circle cx="80" cy="80" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <circle cx="120" cy="220" r="7" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <circle cx="280" cy="30" r="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <circle cx="500" cy="260" r="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <circle cx="740" cy="80" r="7" fill="#1e293b" stroke="#34d399" stroke-width="2" />
  <circle cx="710" cy="220" r="7" fill="#1e293b" stroke="#34d399" stroke-width="2" />

  <!-- Centrality Hub 2 -->
  <circle cx="500" cy="110" r="10" fill="#431407" stroke="#ea580c" stroke-width="2" />
  <circle cx="500" cy="110" r="4.5" fill="#fb923c" />
  <text x="500" y="93" fill="#fdba74" font-size="9" class="net-font" text-anchor="middle" font-weight="600">Sub-Hub (Centrality: 0.74)</text>

  <!-- Centrality Hub 1 (CRITICAL BOTTLENECK INTERSECTION) -->
  <circle cx="280" cy="150" class="hub-beacon" fill="#ef4444" opacity="0.3" />
  <circle cx="280" cy="150" r="12" fill="#450a0a" stroke="#ef4444" stroke-width="2.5" filter="url(#hubGlow)" />
  <circle cx="280" cy="150" r="5.5" fill="#f87171" />
  <text x="280" y="180" fill="#fca5a5" font-size="10" class="net-font" text-anchor="middle" font-weight="700">CRITICAL HUB (Betweenness Centrality: 0.96)</text>
  <text x="280" y="194" fill="#94a3b8" font-size="8.5" class="net-font" text-anchor="middle">Dynamic Green Split Optimization Active</text>

  <!-- Legend & Status Box -->
  <g transform="translate(25, 235)">
    <rect width="210" height="26" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#ef4444" />
    <text x="26" y="16" fill="#cbd5e1" font-size="9" class="net-font">Bottleneck Hub</text>
    <circle cx="118" cy="13" r="4" fill="#38bdf8" />
    <text x="128" y="16" fill="#cbd5e1" font-size="9" class="net-font">Active Route</text>
  </g>
</svg>
